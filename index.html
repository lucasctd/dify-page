<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Página com duas seções</title>
    <style>
      .container {
        display: flex;
        gap: 16px;
      }

      .secao {
        flex: 1;
      }
    </style>
  </head>
  <body>
    <main class="container">
      <section id="secao-1" class="secao">
        <h2 id="titulo-secao-1" style="color: red;">Título da Seção 1</h2>
        <p id="paragrafo-secao-1">Este é um parágrafo de exemplo da primeira seção.</p>
      </section>

      <section id="secao-2" class="secao">
        <h2 id="titulo-secao-2">Título da Seção 2</h2>
        <p id="paragrafo-secao-2">Este é um parágrafo de exemplo da segunda seção.</p>
      </section>
    </main>
  </body>
</html>
